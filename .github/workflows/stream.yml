name: Stream Dashboard to YouTube
on:
  workflow_dispatch:
    inputs:
      auto_restart:
        description: 'Set automatically by the restart workflow — leave unchecked for manual runs (forces a fresh rebuild)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 */6 * * *"   # GitHub Actions caps a run at 6h; this + restart-stream.yml keep it looping

concurrency:
  group: eq-stream-job
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Determine build mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.auto_restart }}" != "true" ]; then
            echo "Manual run detected — will rebuild the image from scratch."
            echo "BUILD=true" >> "$GITHUB_ENV"
          else
            echo "Scheduled or auto-restarted run — will pull the cached image."
            echo "BUILD=false" >> "$GITHUB_ENV"
          fi
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/eq-watch-stream" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: env.BUILD == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push fresh image (manual runs only)
        if: env.BUILD == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull cached image (auto-restart / scheduled runs)
        if: env.BUILD != 'true'
        run: docker pull "$IMAGE:latest"

      - name: Start dashboard live stream
        run: |
          docker run \
            --shm-size=1gb \
            -e YOUTUBE_STREAM_KEY="${{ secrets.YOUTUBE_STREAM_KEY }}" \
            -e AUDIO_URL="${{ secrets.AUDIO_URL }}" \
            -e STREAM_WIDTH="1280" \
            -e STREAM_HEIGHT="720" \
            -e STREAM_FPS="24" \
            "$IMAGE:latest"
